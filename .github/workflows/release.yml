name: Build and release

# Actions -> "Build and release" -> Run workflow, enter the version (e.g. 0.1.3).
# The version must equal patchclamp_gui/__version__ on main.
#
# Every version goes to the in-app update channel (pre-release "updates"):
#   small update  = only the patchclamp_gui package (a few hundred KB)
#   full build    = whole app, for every major version x.y.0, when force_full is set,
#                   or when packaging/min_base.txt names this version (libraries changed)
# Versions x.y.1 ... x.y.20 are small versions (update channel only). The next
# version after x.y.20 is the major version x.(y+1).0, which is also a normal GitHub
# Release with installers, for new users.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.3"
        required: true
      force_full:
        description: "Also build the whole app (libraries or the launcher changed)"
        type: boolean
        default: false
      attach_to_release:
        description: "Optional: also put the full build on this existing Release (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      full: ${{ steps.v.outputs.full }}
      major: ${{ steps.v.outputs.major }}
      min_base: ${{ steps.v.outputs.min_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install . pytest
      - name: Tests
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -m pytest -q
      - id: v
        name: Version and build type
        env: {INPUT_VERSION: "${{ inputs.version }}", FORCE: "${{ inputs.force_full }}"}
        run: |
          want="${INPUT_VERSION#v}"
          have=$(python -c "import patchclamp_gui; print(patchclamp_gui.__version__)")
          test "$want" = "$have" || { echo "input $want != __version__ $have"; exit 1; }
          patch="${want##*.}"
          min_base=$(tr -d '[:space:]' < packaging/min_base.txt)
          major=false; [ "$patch" -eq 0 ] && major=true
          full=$major; { [ "$FORCE" = "true" ] || [ "$min_base" = "$want" ]; } && full=true
          echo "version=$want" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "min_base=$min_base" >> "$GITHUB_OUTPUT"
          echo "version $want  full=$full  major=$major  min_base=$min_base"

  windows:
    needs: test
    if: needs.test.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install . pyinstaller
      - run: Set-Content -NoNewline -Encoding ascii base_version.txt "${{ needs.test.outputs.version }}"
        shell: pwsh
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name PatchClampAnalysis
          --icon packaging/clamptrace.ico --collect-data patchclamp_gui
          --hidden-import matplotlib.backends.backend_pdf --hidden-import matplotlib.backends.backend_svg
          --add-data "base_version.txt:."
          --collect-submodules patchclamp_gui
          --collect-submodules pyqtgraph --collect-data pyqtgraph
          --collect-submodules miniml --collect-data miniml
          --exclude-module numba --exclude-module llvmlite --exclude-module umap
          --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module qt_material
          --exclude-module tkinter packaging/launcher.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\PatchClampAnalysis -DestinationPath PatchClampAnalysis-Windows.zip
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\clamptrace.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Join-Path $env:RUNNER_TEMP 'ClampTrace-install-test'
          $setup = Start-Process .\ClampTrace-Windows-Setup.exe -ArgumentList '/VERYSILENT', '/NORESTART', "/DIR=`"$dir`"" -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$dir\PatchClampAnalysis.exe")) { throw 'Installation failed' }
          $uninstall = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$dir\PatchClampAnalysis.exe")) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            PatchClampAnalysis-Windows.zip
            ClampTrace-Windows-Setup.exe
          retention-days: 30

  macos:
    needs: test
    if: needs.test.outputs.full == 'true'
    runs-on: macos-latest   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install . pyinstaller
      - run: printf %s "${{ needs.test.outputs.version }}" > base_version.txt
      - name: Build .app
        run: |
          pyinstaller --noconfirm --clean --windowed --name PatchClampAnalysis \
            --osx-bundle-identifier org.patchclamp.analysis \
            --icon packaging/clamptrace.icns --collect-data patchclamp_gui \
            --hidden-import matplotlib.backends.backend_pdf --hidden-import matplotlib.backends.backend_svg \
            --add-data "base_version.txt:." \
            --collect-submodules patchclamp_gui \
            --collect-submodules pyqtgraph --collect-data pyqtgraph \
            --collect-submodules miniml --collect-data miniml \
            --exclude-module numba --exclude-module llvmlite --exclude-module umap \
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module qt_material \
            --exclude-module tkinter packaging/launcher.py
      - name: Sign, (optionally) notarize, zip and dmg
        # ad-hoc signature without secrets; Developer ID + notarization once they are added
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos_sign.sh dist/PatchClampAnalysis.app PatchClampAnalysis-macOS-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            PatchClampAnalysis-macOS-arm64.zip
            PatchClampAnalysis-macOS-arm64.dmg
          retention-days: 30

  publish:
    needs: [test, windows, macos]
    if: always() && needs.test.result == 'success' && (needs.test.outputs.full != 'true' || (needs.windows.result == 'success' && needs.macos.result == 'success'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.test.outputs.version }}
      FULL: ${{ needs.test.outputs.full }}
      MAJOR: ${{ needs.test.outputs.major }}
      MIN_BASE: ${{ needs.test.outputs.min_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.test.outputs.full == 'true'
        with: {path: assets, merge-multiple: true}
      - name: Small update package and notes
        run: |
          zip -qr patchclamp_gui-patch.zip patchclamp_gui -x '*__pycache__*'
          awk -v t="## v$VERSION" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "PatchClampAnalysis v$VERSION" > notes.md
          cat notes.md
      - name: Update channel
        run: |
          gh release view updates >/dev/null 2>&1 || gh release create updates --prerelease \
            --title "自动更新通道" --notes "软件内自动更新使用的文件，请不要手动下载。新用户请从最新的正式版本安装。"
          gh release download updates -p latest.json -O old.json 2>/dev/null || echo '{}' > old.json
          upload="patchclamp_gui-patch.zip"
          if [ "$FULL" = "true" ]; then upload="$upload assets/PatchClampAnalysis-Windows.zip assets/PatchClampAnalysis-macOS-arm64.zip"; fi
          gh release upload updates $upload --clobber
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]; v = os.environ["VERSION"]
          base = f"https://github.com/{repo}/releases/download/updates/"
          old = json.load(open("old.json"))
          size = lambda p: os.path.getsize(p)
          m = {"version": v, "notes": open("notes.md", encoding="utf-8").read(),
               "min_base": os.environ["MIN_BASE"],
               "page": f"https://github.com/{repo}/releases/latest",
               "patch": {"url": base + "patchclamp_gui-patch.zip", "size": size("patchclamp_gui-patch.zip")}}
          if os.environ["FULL"] == "true":
              m["full_version"] = v
              m["full"] = {n: {"url": base + n, "size": size("assets/" + n)}
                           for n in ("PatchClampAnalysis-Windows.zip", "PatchClampAnalysis-macOS-arm64.zip")}
          else:
              m["full_version"] = old.get("full_version", "0")
              m["full"] = old.get("full", {})
          json.dump(m, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps(m, ensure_ascii=False, indent=1))
          PY
          gh release upload updates latest.json --clobber
      - name: Public release (major versions x.y.0)
        if: needs.test.outputs.major == 'true'
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "PatchClampAnalysis v$VERSION" --notes-file notes.md --latest
          gh release upload "v$VERSION" assets/* --clobber
      - name: Also attach the full build to an existing Release
        if: needs.test.outputs.full == 'true' && inputs.attach_to_release != ''
        env: {TARGET: "${{ inputs.attach_to_release }}"}
        run: |
          gh release upload "$TARGET" assets/* --clobber
          gh release view "$TARGET" --json body -q .body > body.md
          printf '\n\n> 安装包已替换为 v%s 的构建（加入软件内小版本更新）。\n' "$VERSION" >> body.md
          gh release edit "$TARGET" --notes-file body.md
